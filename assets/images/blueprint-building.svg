  <line x1="280" y1="325" x2="370" y2="325" stroke="#f2b705" stroke-opacity="0.22" stroke-width="0.8"/>
  <line x1="325" y1="150" x2="325" y2="360" stroke="#f2b705" stroke-opacity="0.22" stroke-width="0.8"/>

