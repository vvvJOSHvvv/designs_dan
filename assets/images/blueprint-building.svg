  <line x1="280" y1="185" x2="370" y2="185" stroke="#f2b705" stroke-opacity="0.22" stroke-width="0.8"/>
  <line x1="280" y1="220" x2="370" y2="220" stroke="#f2b705" stroke-opacity="0.22" stroke-width="0.8"/>
