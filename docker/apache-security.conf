# 운영(Render) Apache 하드닝 — Dockerfile이 /etc/apache2/conf-enabled/ 에 복사합니다.
# .htaccess(AllowOverride)에 의존하지 않고 이미지 자체에 규칙을 넣어서, 배포
# 방식이 바뀌어도(예: 나중에 다른 호스팅) 항상 적용되게 합니다.

# includes/db.php는 DATABASE_URL이 없을 때 data/app.db(SQLite)를 로컬 폴백으로
# 만듭니다. Render에 DATABASE_URL을 아직 안 넣은 상태에서 실수로 컨테이너 안에
# 이 파일이 생기더라도, 웹에서 직접 다운로드되지 않도록 문서 루트의 data/를
# 통째로 막습니다 (문의자 개인정보 + 비밀번호 해시가 들어있을 수 있음).
<Directory "/var/www/html/data">
    Require all denied
</Directory>

# 혹시 다른 경로에 DB 파일이 생기더라도 확장자 기준으로 한 번 더 막습니다.
<FilesMatch "\.(db|sqlite|sqlite3)$">
    Require all denied
</FilesMatch>

# CLAUDE.md는 이 프로젝트의 작업 기록(내부 메모)이라 공개될 필요가 없습니다.
<FilesMatch "^CLAUDE\.md$">
    Require all denied
</FilesMatch>

# 404 페이지 (2026-08-16 추가) — 없는 주소로 들어와도 Apache 기본 에러 화면이 아니라
# 사이트 디자인이 유지된 안내 페이지가 보이게 합니다 (프로젝트 루트의 404.php).
ErrorDocument 404 /404.php

# sitemap.xml (2026-08-16 추가) — 내용은 sitemap.php가 services.php 배열을 읽어서
# 자동 생성하지만, 검색엔진이 기대하는 관례적인 주소(/sitemap.xml)로도 접속되도록
# 연결해 둡니다. mod_alias는 Debian Apache 기본 활성 모듈입니다.
Alias /sitemap.xml /var/www/html/sitemap.php
