; 운영(Render) 전용 PHP 설정 — Dockerfile이 /usr/local/etc/php/conf.d/ 에 복사합니다.
; php:8.2-apache 베이스 이미지는 기본 php.ini를 넣지 않으므로, 컴파일 기본값
; (display_errors On)이 그대로 쓰이는 걸 막기 위해 명시적으로 끕니다.
; DB 연결 실패 같은 예외가 방문자 화면에 경로/쿼리 등 내부 정보를 노출하지 않게 합니다.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
